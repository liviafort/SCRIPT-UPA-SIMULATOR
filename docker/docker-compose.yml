version: '3.8'

services:
  upa-simulator:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: upa-simulator
    restart: unless-stopped

    logging:
      driver: "json-file"
      options:
        max-size: "10m"        
        max-file: "3"          
        compress: "true"       

    volumes:
      - ../logs:/app/logs

    environment:
      - PYTHONUNBUFFERED=1 

    deploy:
      resources:
        limits:
          cpus: '1.0'          
          memory: 512M         
        reservations:
          cpus: '0.5'          
          memory: 256M         

    healthcheck:
      test: ["CMD", "pgrep", "-f", "python"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s